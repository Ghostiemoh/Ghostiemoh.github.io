name: Redirect GitHub Pages to ghostiemoh.com

# The site is hosted on Vercel at https://ghostiemoh.com. GitHub will not let a
# username.github.io repo turn Pages off, so Pages just serves a redirect.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Redirecting to ghostiemoh.com</title>
              <link rel="canonical" href="https://ghostiemoh.com/" />
              <meta http-equiv="refresh" content="0; url=https://ghostiemoh.com/" />
              <meta name="robots" content="noindex" />
            </head>
            <body>
              <p>This site has moved to <a href="https://ghostiemoh.com/">ghostiemoh.com</a>.</p>
              <script>
                location.replace(
                  'https://ghostiemoh.com' + location.pathname + location.search + location.hash
                );
              </script>
            </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
